<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FE"/>
      <stop offset="100%" stop-color="#F2ECFC"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="50%" stop-color="#D7141B"/>
      <stop offset="100%" stop-color="#9B0007"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE1E5"/>
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>
  <!-- Shadow oval -->
  <ellipse cx="200" cy="335" rx="140" ry="24" fill="#000000" opacity="0.08"/>
  <g filter="url(#dropShadow)" transform="rotate(-28 190 200)">
    <!-- Toothpaste Tube -->
    <path d="M120 120 L240 120 L225 290 L135 290 Z" fill="url(#tubeGrad)"/>
    <!-- Crimp tail -->
    <rect x="116" y="106" width="128" height="16" rx="3" fill="#B91C1C"/>
    <!-- Tube Branding -->
    <rect x="130" y="145" width="100" height="28" rx="4" fill="#FFFFFF"/>
    <text x="180" y="165" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#D7141B" text-anchor="middle" letter-spacing="1">COLGATE</text>
    <text x="180" y="200" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">TOTAL FRESH</text>
    <text x="180" y="220" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#FEE2E2" text-anchor="middle">12HR CAVITY PROTECTION</text>
    <!-- Cap Neck -->
    <rect x="165" y="290" width="30" height="14" fill="#CBD5E1"/>
    <!-- Cap -->
    <rect x="150" y="304" width="60" height="34" rx="6" fill="url(#capGrad)"/>
    <line x1="156" y1="312" x2="156" y2="330" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="166" y1="312" x2="166" y2="330" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="176" y1="312" x2="176" y2="330" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="186" y1="312" x2="186" y2="330" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="196" y1="312" x2="196" y2="330" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="204" y1="312" x2="204" y2="330" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <!-- Fresh Gel Swirl -->
  <path d="M260 210 C290 190, 310 230, 340 215 C345 212, 330 240, 290 235 Z" fill="#38BDF8" opacity="0.95"/>
  <path d="M265 212 C285 198, 305 228, 330 218" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Sparkles -->
  <g fill="#F59E0B">
    <path d="M300 120 L304 130 L314 134 L304 138 L300 148 L296 138 L286 134 L296 130 Z"/>
    <path d="M90 240 L93 247 L100 250 L93 253 L90 260 L87 253 L80 250 L87 247 Z"/>
  </g>
</svg>
